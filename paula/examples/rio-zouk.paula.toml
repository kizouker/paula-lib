#:schema ../schema/paula.schema.json
# Rio zouk, 90 BPM, A aeolian. Needs a base module with samples 1-5:
#   1 kick, 2 snare, 3 (unused here), 4 bass (looped), 5 keys (looped)
# `cargo run --example make-kit -- kit.mod` writes a generated kit that fits.

[style]
name = "Rio zouk"
key = "A aeolian"
meter = "4/4"
bpm = 90
tempo = [80, 100]
swing = 0.1 # stored, not rendered in v0

# One chord per bar, or two per bar. Chord symbols or degrees of the key's own scale.
[progression]
intro = "Am7 | Fmaj7 | Am7 | Fmaj7"
verse = "Am7 | Fmaj7 | Dm7 | Em7"
chorus = "VImaj7 VII7 | i7 | VImaj7 VII7 | i7"

# x hit, o ghost (quiet), . rest. 16 steps = one bar.
[role.kick]
channel = 1
sample = 1
groove = "x.....x.x.....x."
clave = "3-2"

[role.snare]
channel = 2
sample = 2
groove = "....x..o....x.o."
clave = "3-2"
max_density = 6

[role.bass]
channel = 3
sample = 4
register = "C-1..G-2"
rule = "root-fifth"
groove = "x.....x.x.....x."

[role.keys]
channel = 4
sample = 5
register = "C-2..B-3"
rule = "chord-tones"
groove = "..x...x...x...x. ..x...x...x...xo"

[song]
form = "intro 4, verse 8, chorus 8, verse 8, chorus 8"
