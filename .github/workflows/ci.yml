name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install SDL2 (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev

      - name: Install SDL2 (macOS)
        if: runner.os == 'macOS'
        run: brew install sdl2

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

  rust:
    name: Rust tests (macos-latest)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.100.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates/pt2-dsp
            crates/pt2-viz
      - name: Install SoX (tests/convert_sh.rs runs assets/starter-kit/convert.sh)
        run: brew install sox
      - name: Test pt2-dsp
        run: cargo test --locked
        working-directory: crates/pt2-dsp
      # pt2-viz tests are not run on macOS: three-d 0.19 -> winit 0.28 /
      # glutin 0.30 pin objc2 0.3.0-beta.3.patch-leaks.3, which no longer
      # compiles on rustc 1.100.0 (E0277 in ivar_forwarding_impls.rs) and
      # cannot be fixed with `cargo update`. The wasm job builds pt2-viz.

  paula:
    name: paula tests (${{ matrix.os }})
    # Headless API, paula-play and paula-tui (issue #22). Not a required check yet.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install SDL2 headers and ALSA (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libasound2-dev pkg-config
      - name: Install SDL2 headers (macOS)
        if: runner.os == 'macOS'
        run: brew install sdl2 pkg-config
      - uses: dtolnay/rust-toolchain@1.100.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: paula
      - name: Test paula (no audio device needed)
        run: cargo test --locked
        working-directory: paula
      - name: Test paula without default features (no audio, tui or llm client)
        run: cargo test --locked --no-default-features
        working-directory: paula

  wasm:
    name: Wasm build (ubuntu-latest)
    runs-on: ubuntu-latest
    # Non-blocking, like the Ubuntu C build (PT2AA-NFR-001).
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/pt2-viz
      - name: Cache wasm-bindgen-cli
        id: wbg
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-cli-0.2.130
      - name: Install wasm-bindgen-cli (version must match Cargo.lock)
        if: steps.wbg.outputs.cache-hit != 'true'
        run: cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - name: Build wasm
        run: bash crates/pt2-viz/build-web.sh
