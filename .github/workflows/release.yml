name: paula release

# Builds paula-play and paula-tui and packs them with paula/scripts/bundle.sh.
# - Run it by hand (Actions -> paula release -> Run workflow): the archives are kept as artifacts.
# - Push a tag like paula-v0.1.0: the archives are also attached to a GitHub Release.

on:
  workflow_dispatch:
  push:
    tags: ["paula-v*"]

permissions:
  contents: write

jobs:
  bundle:
    name: bundle (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-22.04: older glibc, so the binary also runs on older Ubuntu/Debian.
        os: [ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install SDL2 headers and ALSA (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libasound2-dev pkg-config
      - name: Install SDL2 headers (macOS)
        if: runner.os == 'macOS'
        run: brew install sdl2 pkg-config
      - uses: dtolnay/rust-toolchain@1.100.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: paula
      - name: Test
        run: cargo test --locked
        working-directory: paula
      - name: Bundle
        id: bundle
        run: echo "file=$(bash paula/scripts/bundle.sh "$RUNNER_TEMP/dist")" >> "$GITHUB_OUTPUT"
      - name: Smoke test the packed binary
        run: |
          d="$RUNNER_TEMP/smoke"; mkdir -p "$d"
          tar -C "$d" -xzf "${{ steps.bundle.outputs.file }}"
          set +e; "$d"/paula-*/paula-play --help; code=$?; set -e
          test "$code" -eq 2   # usage text exits 2
      - uses: actions/upload-artifact@v4
        with:
          name: paula-${{ matrix.os }}
          path: ${{ steps.bundle.outputs.file }}
          if-no-files-found: error

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/paula-v')
    needs: bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release with the archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
